name: Daily domain ingestion

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/daily-domains.yml"
      - "scripts/**"
      - "tests/**"
  schedule:
    - cron: "45 7 * * *"
      timezone: "Africa/Lagos"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-domain-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    name: Fetch and publish domain datasets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Test domain normalisation
        run: python -m unittest discover -s tests -v

      - name: Download, validate and package source feeds
        run: python scripts/collect_domains.py

      - name: Publish dated GitHub Release and upload domain files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/publish_release.py
