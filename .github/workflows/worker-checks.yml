name: Domain Worker checks
on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "tests/**"
      - ".github/workflows/worker-checks.yml"
  pull_request:
    branches: [main]
    paths:
      - "worker/**"
      - "tests/**"
      - ".github/workflows/worker-checks.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Worker JavaScript syntax
        run: node --check worker/index.js
      - name: Run ingestion and index tests
        run: python -m unittest discover -s tests -v
